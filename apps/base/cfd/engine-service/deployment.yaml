apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-service
  namespace: cfd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-service
  template:
    metadata:
      labels:
        app: engine-service
    spec:
      containers:
        - name: engine-service
          image: ghcr.io/pallava-joshi/cfd/engine-service:v1.2.1
          ports:
            - containerPort: 3002
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: engine-service-env
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3